<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simulador de meta tag — título e meta description com preview</title>
  <style>
body{font-family:Segoe UI,sans-serif;padding:20px;background:#f8fafc;color:#0f172a}h2{font-size:1.1rem;color:#0284c7;margin-bottom:14px}h3{font-size:.95rem;color:#0f172a;margin:16px 0 8px}.form label{display:block;font-size:.82rem;font-weight:700;margin-top:10px;margin-bottom:4px}.form input,.form textarea{width:100%;padding:9px 12px;border:1px solid #cbd5e1;border-radius:6px;font-family:inherit;font-size:.85rem}.form textarea{resize:vertical;min-height:60px;height:60px}.contador{font-size:.7rem;color:#64748b;text-align:right;margin-top:3px}.contador.alerta{color:#dc2626;font-weight:700}.serp{background:#fff;border:1px solid #cbd5e1;border-radius:8px;padding:12px 16px;max-width:600px}.serp .url{font-size:.75rem;color:#0f766e;margin-bottom:3px}.serp .titulo{color:#1a0dab;font-size:1rem;font-weight:600;line-height:1.3;margin-bottom:3px}.serp .meta{font-size:.8rem;color:#4d5156;line-height:1.4}
  </style>
</head>
<body>
<h2>📝 Simulador de Meta Tags</h2><div class="form"><label>Título:</label><input id="inTitulo" value="Guia completo de SEO Avançado 2026"><div id="cTitulo" class="contador">0/60</div><label>Meta Description:</label><textarea id="inMeta">Aprenda técnicas de otimização on-page, dados estruturados e link building para aumentar a visibilidade do seu site nos mecanismos de busca.</textarea><div id="cMeta" class="contador">0/160</div></div><h3>Preview na SERP:</h3><div class="serp"><div class="url">www.seusite.com.br › seo-avancado</div><div class="titulo" id="pvtitulo">Guia completo de SEO Avançado 2026</div><div class="meta" id="pvmeta"></div></div>
  <script>
function atualizar(){var t=document.getElementById("inTitulo").value;var m=document.getElementById("inMeta").value;document.getElementById("pvtitulo").textContent=t||"(título)";var metaCurta=m.substring(0,160)+(m.length>160?"...":"");document.getElementById("pvmeta").textContent=metaCurta||"(meta)";var ct=document.getElementById("cTitulo");var cm=document.getElementById("cMeta");ct.textContent=t.length+"/60";cm.textContent=m.length+"/160";ct.classList.toggle("alerta",t.length>60);cm.classList.toggle("alerta",m.length>160);}document.getElementById("inTitulo").addEventListener("input",atualizar);document.getElementById("inMeta").addEventListener("input",atualizar);atualizar();
  </script>
</body>
</html>
